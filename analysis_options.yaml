include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # The flutter-builder screenshot harness lives outside lib/ and test/ and
    # is driven by tool/local_screenshots.py, not by `flutter test`.
    - tool/screenshots/**

linter:
  rules:
    prefer_single_quotes: true

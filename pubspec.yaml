name: khatabook
description: "KhataBook — Smart Digital Khata. An offline-first personal finance ledger (Plan · Track · Save)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# B1 deliberately has no third-party runtime dependencies: the scaffold, the
# palette and the money/date formatters must compile anywhere, offline.
# Riverpod / go_router / Drift / Supabase arrive with the features that need
# them (see docs/spec/architecture.md), each with a pinned version.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/entry_notebook.png

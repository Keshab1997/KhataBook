name: khatabook
description: "KhataBook — Smart Digital Khata. An offline-first personal finance ledger (Plan · Track · Save)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Local persistence uses Drift. Supabase remains opt-in and is not configured.
dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - lib/features/ledger/data/schema.sql
